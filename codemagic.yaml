workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd simple_live_app
          flutter pub get
      - name: Build APK
        script: |
          cd simple_live_app
          flutter build apk --release
    artifacts:
      - simple_live_app/build/**/outputs/**/*.apk
