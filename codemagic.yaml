workflows:
  android-apk:
    name: Simple Live Android APK
    max_build_duration: 120
    environment:
      flutter: 3.38.10
      java: 17
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Show tool versions
        script: |
          flutter --version
          java -version
      - name: Configure Android
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/simple_live_app/android/local.properties"
      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR/simple_live_app"
          flutter pub get
      - name: Build installable release APK
        script: |
          cd "$CM_BUILD_DIR/simple_live_app"
          flutter build apk --release
    artifacts:
      - simple_live_app/build/app/outputs/flutter-apk/*.apk
      - simple_live_app/build/app/outputs/mapping/release/mapping.txt
